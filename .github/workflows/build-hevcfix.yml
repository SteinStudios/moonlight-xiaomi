name: Build Artemis + Amlogic HEVC-fix (Xiaomi TV Box S 3rd Gen)

on:
  workflow_dispatch:
  push:
    tags:
      - "hevc-*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 27.0.12077973
        run: sdkmanager "ndk;27.0.12077973"

      # Patchen fejler haardt hvis et anker mangler, saa vi aldrig
      # udgiver en APK der ligner fixet, men ikke indeholder det.
      - name: Apply Amlogic HEVC fix
        run: python3 apply_hevc_fix.py

      - name: Verify patch landed in source
        run: |
          F=app/src/main/java/com/limelight/binding/video/MediaCodecHelper.java
          grep -q 'MiTV-AFMU0' "$F"                 || { echo "::error::model-liste mangler"; exit 1; }
          grep -q 'isHevcLowLatencyBrokenModel' "$F" || { echo "::error::guard mangler"; exit 1; }
          grep -q 'isAmlogicRfiSafe' "$F"            || { echo "::error::RFI-flag mangler"; exit 1; }
          grep -q 'noirhevc' app/build.gradle        || { echo "::error::applicationId ikke aendret"; exit 1; }
          echo "Patch verificeret i kildekoden."

      # Lint slaas fra via init-script i stedet for '-x <taskname>',
      # saa byggget ikke braekker hvis Artemis omdoeber en variant.
      - name: Disable lint abort
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/nolint.gradle <<'EOF'
          gradle.projectsLoaded {
              rootProject.subprojects { p ->
                  p.plugins.withId('com.android.application') {
                      p.android.lint {
                          abortOnError = false
                          checkReleaseBuilds = false
                      }
                  }
              }
          }
          EOF

      - name: Find release assemble task
        id: task
        run: |
          chmod +x gradlew
          TASK=$(./gradlew :app:tasks --all --no-daemon -q 2>/dev/null \
                 | grep -oE '^assembleNonRoot[A-Za-z_]*Release' | head -1)
          if [ -z "$TASK" ]; then
            echo "::warning::kunne ikke finde task automatisk, bruger fallback"
            TASK="assembleNonRoot_gameRelease"
          fi
          echo "Bruger gradle-task: $TASK"
          echo "task=$TASK" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: ./gradlew ${{ steps.task.outputs.task }} --no-daemon --stacktrace

      - name: Sign release APKs (debug key)
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          echo "build-tools: $BT"

          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

          mkdir -p out
          shopt -s nullglob globstar
          found=0
          for APK in app/build/outputs/apk/**/release/*-unsigned.apk; do
            found=1
            BASE="$(basename "$APK" -unsigned.apk)"
            "$BT/zipalign" -f -p 4 "$APK" "/tmp/$BASE-aligned.apk"
            "$BT/apksigner" sign \
              --ks debug.keystore \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android --key-pass pass:android \
              --out "out/$BASE-hevcfix.apk" \
              "/tmp/$BASE-aligned.apk"
            "$BT/apksigner" verify --verbose "out/$BASE-hevcfix.apk"
          done
          if [ "$found" != "1" ]; then
            echo "::error::ingen unsigned APK fundet"
            find app/build/outputs -name '*.apk' -print || true
            exit 1
          fi
          ls -la out/

      - name: Upload APKs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: artemis-hevcfix-apks
          path: out/*.apk
          retention-days: 30

      - name: Create GitHub Release (kun ved hevc-* tag)
        if: startsWith(github.ref, 'refs/tags/hevc-')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: true
          files: out/*.apk
